<h1>Event Binding</h1>
<!--<button (click)="callMe()">Click Me</button>-->
<button (click)="callMe()"> ClickMe</button>
<button class="button-left" (click)="counter('minus')">-</button>
<span>{{count}}</span>
<button class="button-right" (click)="counter('plus')">+</button>
<br>
<input type="text" (input)="handleEvent($event.type)">
<br>
<select (change)="handleEvent($event.type)" name="" id="">
  <option value="">Car</option>
  <option value="">Bike</option>
  <option value="">Mobile</option>

</select>
<div (mouseenter)="handleEvent($event.type)" class="div1">

</div>
<div (mouseleave)="handleEvent($event.type)" class="div2">

</div>
<h2>{{data}}</h2>
<button (click)="updateValue(60)">Update Data</button>
<button (click)="handledEvent($event)">Click Me</button>
<input type="text"  (change)="handledEvent($event)">
